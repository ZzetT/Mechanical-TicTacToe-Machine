<g font-size="11" fill="#222">
<text x="20" y="486">One field of an EXISTING card, seen from the front, card at rest. Beige = card, white = cutout, dashed = field boundary.</text>
<text x="20" y="501">"rest" = rod while the card is up. Coloured rods = rod positions after the card dropped 18 mm and was pushed 10.8 mm left;</text>
<text x="20" y="516">the card hangs on the corridor ceiling. Dashed lines = what happens when the card is lifted straight up: the sloped corridor</text>
<text x="20" y="531">floor slides the card back to the right, and a rod that is not where the drop slot needs it is pushed to the middle.</text>
</g>
